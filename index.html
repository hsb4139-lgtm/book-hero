<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책의 용사 · 리브라리아 독서 RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1e2150; --ink2:#2c3070; --ink3:#3b4190;
  --bg:#e6d8b8; --panel:#fcf5e3; --panel2:#f2e3bf; --card:#fffaf0;
  --text:#2a2340; --muted:#6c6285; --line:#d8c496;
  --teal:#179e8f; --teal2:#6ef3e0; --gold:#e5a322; --gold2:#ffd966; --ruby:#d23f5c; --ok:#2e8b57;
  --g0:#7e858f; --g1:#2f8f3d; --g2:#2a6fd6; --g3:#8546d0; --g4:#d97f06; --g5:#d93a31;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121333; --panel:#1f2250; --panel2:#2a2e66; --card:#262a5e;
    --text:#f5eedb; --muted:#b9b2d6; --line:#3f448c;
    --g0:#b3b9c2; --g1:#63c56f; --g2:#6ea7ff; --g3:#b98cff; --g4:#ffb347; --g5:#ff7a70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121333; --panel:#1f2250; --panel2:#2a2e66; --card:#262a5e;
  --text:#f5eedb; --muted:#b9b2d6; --line:#3f448c;
  --g0:#b3b9c2; --g1:#63c56f; --g2:#6ea7ff; --g3:#b98cff; --g4:#ffb347; --g5:#ff7a70;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;line-height:1.25}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{font-family:var(--display);font-size:1rem;border:0;border-radius:12px;padding:.55em 1em;background:var(--ink2);color:#fff;box-shadow:0 4px 0 #0e1036;transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0e1036}
.btn.gold{background:var(--gold);color:#3a2600;box-shadow:0 4px 0 #9b6a0c}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #0b5f56}
.btn.ruby{background:var(--ruby);box-shadow:0 4px 0 #87213a}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--line)}
.btn.sm{font-size:.88rem;padding:.35em .75em;border-radius:10px;box-shadow:0 3px 0 #0e1036}
.btn.sm.gold{box-shadow:0 3px 0 #9b6a0c}.btn.sm.teal{box-shadow:0 3px 0 #0b5f56}.btn.sm.ruby{box-shadow:0 3px 0 #87213a}
.btn.sm.ghost{box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.chip{font-family:var(--display);border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.25em .8em;font-size:.9rem}
.chip.on{background:var(--ink2);border-color:var(--ink2);color:#fff}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(1200px 500px at 50% -10%, #3b4190 0%, transparent 60%), var(--ink)}
.login-box{width:min(760px,100%);color:#fff}
.logo{font-family:var(--display);font-size:clamp(3rem,11vw,6.2rem);line-height:.95;letter-spacing:-.02em;color:var(--gold2);text-shadow:0 5px 0 #7a4d00, 0 10px 30px #0008}
.logo small{display:block;font-size:.26em;color:#cfd3ff;text-shadow:none;letter-spacing:0;margin-top:.7em}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin:28px 0 20px}
.hero-card{background:#ffffff12;border:2px solid #ffffff26;border-radius:18px;padding:8px 6px 10px;color:#fff;text-align:center}
.hero-card:hover{background:#ffffff22}
.hero-card svg{width:84px;height:92px;display:block;margin:0 auto}
.hero-card b{display:block;font-family:var(--display);font-weight:400}
.hero-card span{font-size:.8rem;color:#cfd3ff}
.login-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- create ---------- */
.create{display:grid;grid-template-columns:260px 1fr;gap:24px;background:var(--panel);color:var(--text);border-radius:22px;padding:22px}
.create .preview{background:linear-gradient(#bfe9ff,#fff4d6);border-radius:16px;display:grid;place-items:center;padding:12px}
.create .preview svg{width:200px;height:230px}
.field{margin:0 0 14px}
.field label,.lab{display:block;font-family:var(--display);margin-bottom:4px}
.inp{width:100%;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:.5em .7em}
textarea.inp{min-height:70px;resize:vertical}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px #0003}
.sw.on{border-color:var(--ink2);outline:2px solid var(--gold)}
@media (max-width:640px){.create{grid-template-columns:1fr}.create .preview svg{width:150px;height:170px}}

/* ---------- game layout ---------- */
.hud{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap;box-shadow:0 4px 0 #0e1036}
.hud .who{display:flex;align-items:center;gap:8px;min-width:0}
.hud .face{width:42px;height:42px;border-radius:12px;background:#ffffff18;overflow:hidden}
.hud .face svg{width:62px;height:70px;margin:-6px 0 0 -10px}
.hud .nm{font-family:var(--display);font-size:1.1rem;line-height:1.1}
.hud .ttl{font-size:.75rem;color:var(--gold2)}
.lv{font-family:var(--display);background:var(--gold);color:#3a2600;border-radius:8px;padding:0 .45em;font-size:1rem}
.expbar{flex:1 1 180px;min-width:150px}
.bar{height:14px;background:#0e1036;border-radius:99px;overflow:hidden;border:2px solid #ffffff30;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .5s}
.bar.hp i{background:linear-gradient(90deg,#ff6b6b,#ffb3b3)}
.bar.boss i{background:linear-gradient(90deg,#8b2bd6,#ff6bd0)}
.expbar .t{font-size:.72rem;color:#cfd3ff;display:flex;justify-content:space-between}
.cur{display:flex;gap:12px;font-family:var(--display)}
.cur span{display:flex;align-items:center;gap:4px}
.ico{width:18px;height:18px;flex:none}
.hud .tools{display:flex;gap:6px;margin-left:auto}
.iconbtn{background:#ffffff18;border:0;color:#fff;border-radius:10px;padding:.35em .6em;font-family:var(--display);position:relative}
.badge{position:absolute;top:-5px;right:-5px;background:var(--ruby);color:#fff;border-radius:99px;font-size:.7rem;min-width:18px;height:18px;display:grid;place-items:center}

.play{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,1fr);gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.stage-wrap{position:sticky;top:78px;align-self:start}
@media (max-width:900px){.play{grid-template-columns:1fr;padding:10px}.stage-wrap{position:relative;top:0}}

.stage{position:relative;aspect-ratio:16/11;border-radius:22px;overflow:hidden;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.stage .bg{position:absolute;inset:0;width:100%;height:100%}
.stage .region-name{position:absolute;left:12px;top:10px;font-family:var(--display);color:#fff;background:#1e2150b8;border-radius:10px;padding:.15em .7em;font-size:.95rem}
.stage .ap-pill{position:absolute;right:12px;top:10px;font-family:var(--display);color:#3a2600;background:var(--gold2);border-radius:10px;padding:.15em .7em;font-size:.9rem}
.hero{position:absolute;left:50%;bottom:9%;width:34%;transform:translateX(-50%);transition:left .35s}
.hero.hunting{left:30%}
.hero svg{width:100%;height:auto;display:block;animation:bob 2.4s ease-in-out infinite}
.hero.lunge svg{animation:lunge .35s ease-out}
.nameplate{position:absolute;left:50%;transform:translateX(-50%);bottom:-6%;white-space:nowrap;text-align:center;font-family:var(--display);font-size:.9rem;color:#fff;background:#1e2150d9;border-radius:8px;padding:0 .6em}
.nameplate.gold{background:linear-gradient(90deg,#b8860b,#ffd966,#b8860b);color:#3a2600}
.nameplate em{display:block;font-style:normal;font-size:.72rem;color:var(--gold2);line-height:1.2}
.nameplate.gold em{color:#5a3a00}
.pet{position:absolute;bottom:8%;width:12%;left:66%;transition:left .35s}
.hero.hunting ~ .pet{left:12%}
.pet svg{width:100%;height:auto;animation:bob 1.8s ease-in-out infinite reverse}
.mob{position:absolute;right:10%;bottom:9%;width:25%}
.mob svg{width:100%;height:auto;animation:wobble 1.6s ease-in-out infinite}
.mob.hit svg{animation:hit .3s}
.mob .mbar{position:absolute;left:10%;right:10%;top:-12px}
.mob .mname{position:absolute;left:50%;transform:translateX(-50%);bottom:-18px;font-family:var(--display);font-size:.8rem;color:#fff;background:#8a1f35d9;border-radius:6px;padding:0 .5em;white-space:nowrap}
.dmg{position:absolute;right:20%;bottom:45%;font-family:var(--display);font-size:1.9rem;color:#fff;text-shadow:0 3px 0 var(--ruby),0 0 8px #000;animation:rise .9s ease-out forwards;pointer-events:none}
.dmg.crit{color:var(--gold2);font-size:2.4rem}
.preview-banner{position:absolute;left:50%;transform:translateX(-50%);top:44px;background:#fffaf0ee;color:#2a2340;border-radius:10px;padding:.2em .4em .2em .8em;font-family:var(--display);font-size:.9rem;display:flex;gap:8px;align-items:center;white-space:nowrap}
.glyphs span{position:absolute;bottom:-20px;font-family:var(--display);color:#ffffff;opacity:0;animation:float 9s linear infinite;text-shadow:0 0 8px var(--teal2)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(18%) rotate(4deg)}100%{transform:translateX(0)}}
@keyframes wobble{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
@keyframes hit{0%{transform:translateX(0);filter:brightness(2.2)}50%{transform:translateX(8%)}100%{transform:translateX(0)}}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.75}85%{opacity:.5}100%{transform:translateY(-110%);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.side{min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display);border:0;background:var(--panel2);color:var(--text);border-radius:12px 12px 12px 12px;padding:.45em .9em;font-size:1rem;white-space:nowrap;flex:none;position:relative}
.tab.on{background:var(--ink2);color:#fff;box-shadow:0 3px 0 #0e1036}
.panel{background:var(--panel);border-radius:18px;padding:16px;border:2px solid var(--line)}
.panel h2{font-size:1.35rem;margin-bottom:10px}
.panel h3{font-size:1.1rem;margin:18px 0 8px}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spacer{flex:1}
.stack>*+*{margin-top:10px}
.pill{display:inline-block;font-family:var(--display);font-size:.78rem;border-radius:6px;padding:0 .45em;background:var(--panel2)}
.gr0{color:var(--g0)}.gr1{color:var(--g1)}.gr2{color:var(--g2)}.gr3{color:var(--g3)}.gr4{color:var(--g4)}.gr5{color:var(--g5)}
.gb0{border-color:var(--g0)!important}.gb1{border-color:var(--g1)!important}.gb2{border-color:var(--g2)!important}.gb3{border-color:var(--g3)!important}.gb4{border-color:var(--g4)!important}.gb5{border-color:var(--g5)!important}

/* region picker */
.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.reg{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 4px;text-align:center;font-family:var(--display);font-size:.78rem;line-height:1.2}
.reg b{display:block;font-weight:400;font-size:.95rem}
.reg.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--card))}
.reg[disabled]{opacity:.45}
@media (max-width:480px){.regions{grid-template-columns:repeat(2,1fr)}}

/* item cards */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px}
.item .thumb{background:linear-gradient(var(--panel2),var(--card));border-radius:10px;height:112px;display:grid;place-items:center;overflow:hidden}
.item .thumb svg{height:118px;width:auto}
.item .nm{font-family:var(--display);font-size:.98rem;line-height:1.2}
.item .meta{font-size:.78rem;color:var(--muted);line-height:1.35}
.item .act{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.item.eq{outline:3px solid var(--teal);outline-offset:-2px}

/* record form */
.books{display:flex;gap:8px;flex-wrap:wrap}
.book-chip{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:.35em .7em;text-align:left;font-size:.88rem;line-height:1.3;max-width:220px}
.book-chip b{font-family:var(--display);font-weight:400;display:block;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-chip.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--card))}
.pages{display:flex;align-items:center;gap:8px}
.pages .inp{width:90px}
.reward{background:var(--ink);color:#fff;border-radius:14px;padding:12px}
.reward .big{font-family:var(--display);font-size:1.3rem;color:var(--gold2)}
.reward ul{margin:6px 0 0;padding-left:18px;font-size:.88rem;color:#dfe2ff}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:.2em .6em;font-size:.9rem}
.mood.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--card))}
.err{color:var(--ruby);font-size:.85rem;margin-top:3px}
.words .row{margin-bottom:6px}
.words .inp{flex:1;min-width:0}
.hint{font-size:.8rem;color:var(--muted);margin-top:2px}

/* quests */
.q{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.q .qt{flex:1;min-width:0}
.q .qt b{font-family:var(--display);font-weight:400;display:block}
.q .bar{height:10px;border-color:var(--line);background:var(--panel2)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:2px dashed var(--line);border-radius:12px;padding:8px;font-size:.82rem;line-height:1.35}
.ach b{font-family:var(--display);font-weight:400;font-size:.98rem;display:block}
.ach.got{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}

/* shelf */
.shelf{background:linear-gradient(#7a4f2a,#5c3a1e);border-radius:12px;padding:12px 10px 0;display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;min-height:120px;box-shadow:inset 0 -12px 0 #3f2712}
.spine{width:30px;border-radius:4px 4px 0 0;color:#fff;font-family:var(--display);font-size:.72rem;writing-mode:vertical-rl;padding:6px 0;border:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:inset -4px 0 0 #0002}
.genres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gen{border:2px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;font-size:.75rem;line-height:1.25}
.gen.got{color:#fff;border-color:transparent}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.pbadge{font-family:var(--display);border-radius:10px;padding:.2em .6em;font-size:.85rem;border:2px dashed var(--line);color:var(--muted)}
.pbadge.got{border:2px solid var(--gold);color:var(--text);background:color-mix(in srgb,var(--gold) 15%,var(--card))}

/* job */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.job{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px}
.job h4{font-size:1.1rem}
.job ol{margin:6px 0;padding-left:20px;font-size:.86rem}
.job.mine{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}

/* modal & toast */
.overlay{position:fixed;inset:0;background:#0b0c26b3;z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);color:var(--text);border-radius:20px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink)}
.modal h2{font-size:1.4rem;margin-bottom:8px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:.5em 1em;font-family:var(--display);box-shadow:0 4px 0 #0e1036;animation:tin .25s ease-out}
.toast.bad{background:var(--ruby)}
.toast.good{background:var(--teal)}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.levelup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,#ffd96655 0%,transparent 60%)}
.levelup div{font-family:var(--display);text-align:center;color:var(--gold2);text-shadow:0 6px 0 #7a4d00,0 0 40px #ffd966;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.levelup b{display:block;font-weight:400;font-size:clamp(3rem,12vw,6rem);line-height:1}
.levelup span{font-size:1.4rem;color:#fff;text-shadow:0 3px 0 var(--ink)}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* teacher */
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--card)}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.tbl th{font-family:var(--display);font-weight:400;background:var(--panel2)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.appr{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.appr .txt{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.95rem}
.teacher-head{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.teacher-main{max-width:1100px;margin:0 auto;padding:16px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-weight:400;color:var(--text);font-size:1.1rem;margin-bottom:4px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ================================================================
   학급 서버 설정은 이 파일에 적지 않아요.
   Vercel 환경변수(SUPABASE_URL, SUPABASE_ANON_KEY, CLASS_CODE)를
   /api/config 가 읽어서 게임에 전달합니다.
   이 파일을 그냥 열거나 환경변수가 없으면 이 기기에만 저장돼요.
   ================================================================ */
(function(){
'use strict';
let CLASS_CODE='class6-4-bookhero-7k2q';

/* ================= utilities ================= */
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const isWeekend=s=>{const w=parseD(s).getDay();return w===0||w===6};
const weekKey=s=>{const d=parseD(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d)};
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dark(h,f){f=f==null?.7:f;h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return '#'+[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v*f).toString(16).padStart(2,'0')).join('')}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const nonsp=t=>String(t||'').replace(/\s/g,'').length;

function hpin(p){const str=CLASS_CODE+':'+p;let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function fresh(){return {settings:{teacherPinH:hpin('0000'),expMult:1,className:'우리 반'},students:{},approvals:[]}}
let S=fresh();let REMOTE=null;const lastJ={};

 S.approvals=S.approvals||[];for(const id in S.students){const s=S.students[id];if(s.pin!=null){s.pinH=hpin(s.pin);delete s.pin}if(!s.boss)s.boss=null}}

function loadScript(src){return new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('스크립트를 불러오지 못함: '+src));document.head.appendChild(t)})}
function snapAll(){lastJ.meta=JSON.stringify({settings:S.settings});for(const id in S.students)lastJ['s:'+id]=JSON.stringify(S.students[id]);S.approvals.forEach(a=>lastJ['a:'+a.id]=JSON.stringify(a))}
function remoteSave(){const w=[];const now=new Date().toISOString();
 const put=(k,table,row,obj)=>{const j=JSON.stringify(obj);if(lastJ[k]===j)return;lastJ[k]=j;
  w.push(REMOTE.sb.from(table).upsert(Object.assign(row,{class_code:CLASS_CODE,data:JSON.parse(j),updated_at:now})).then(r=>{if(r.error){lastJ[k]=null;throw r.error}}))};
 put('meta',TB.meta,{},{settings:S.settings});
 for(const id in S.students)put('s:'+id,TB.st,{id},S.students[id]);
 S.approvals.forEach(a=>put('a:'+a.id,TB.ap,{id:a.id},a));
 Promise.all(w).catch(e=>{console.error(e);toast('학급 서버에 저장하지 못했어요. 인터넷 연결을 확인해요.','bad')})}
function remoteDel(kind,id){if(!REMOTE)return;delete lastJ[(kind==='st'?'s:':'a:')+id];REMOTE.sb.from(TB[kind]).delete().eq('id',id).then(r=>{if(r.error)console.error(r.error)})}
function softRender(){if(modalEl||cur.create)return;const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;if(cur.sid&&!cur.teacher&&(cur.tab==='rec'||cur.hunt))return;render()}
function onStu(p){if(p.eventType==='DELETE'){const id=p.old&&p.old.id;if(!id||!S.students[id])return;delete S.students[id];delete lastJ['s:'+id];if(cur.sid===id)cur.sid=null;softRender();return}
 const r=p.new;if(!r||r.class_code!==CLASS_CODE)return;if(r.id===cur.sid&&!cur.teacher)return;const j=JSON.stringify(r.data);if(lastJ['s:'+r.id]===j)return;S.students[r.id]=r.data;lastJ['s:'+r.id]=j;softRender()}
function onAp(p){if(p.eventType==='DELETE'){const id=p.old&&p.old.id;const i=S.approvals.findIndex(a=>a.id===id);if(i<0)return;S.approvals.splice(i,1);delete lastJ['a:'+id];softRender();return}
 const r=p.new;if(!r||r.class_code!==CLASS_CODE)return;const j=JSON.stringify(r.data);if(lastJ['a:'+r.id]===j)return;const i=S.approvals.findIndex(a=>a.id===r.id);if(i>=0)S.approvals[i]=r.data;else S.approvals.push(r.data);lastJ['a:'+r.id]=j;
 if(cur.sid&&!cur.teacher&&me()&&applyDecisions(me()))save();softRender()}
function onMeta(p){const r=p.new;if(!r||r.class_code!==CLASS_CODE)return;Object.assign(S.settings,(r.data||{}).settings||{});lastJ.meta=JSON.stringify({settings:S.settings});softRender()}
async function initRemote(cfg){CLASS_CODE=cfg.classCode;await loadScript(SB_JS);
 const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});
 const [m,ss,as]=await Promise.all([sb.from(TB.meta).select('data').eq('class_code',CLASS_CODE).maybeSingle(),sb.from(TB.st).select('id,data').eq('class_code',CLASS_CODE),sb.from(TB.ap).select('id,data').eq('class_code',CLASS_CODE)]);
 const err=m.error||ss.error||as.error;if(err)throw err;
 S=fresh();if(m.data)Object.assign(S.settings,(m.data.data||{}).settings||{});(ss.data||[]).forEach(r=>{S.students[r.id]=r.data});(as.data||[]).forEach(r=>S.approvals.push(r.data));
 normalize();snapAll();REMOTE={sb};MODE.remote=true;if(!m.data){lastJ.meta=null;save()}
 sb.channel('bh-'+CLASS_CODE)
  .on('postgres_changes',{event:'*',schema:'public',table:TB.st},onStu)
  .on('postgres_changes',{event:'*',schema:'public',table:TB.ap},onAp)
  .on('postgres_changes',{event:'*',schema:'public',table:TB.meta},onMeta)
  .subscribe(st=>{if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')console.warn('실시간 연결 문제:',st)})}
async function boot(){let cfg=null;
 try{const r=await fetch('/api/config',{cache:'no-store'});if(r.ok)cfg=await r.json()}catch(e){}
 if(cfg){const miss=['supabaseUrl','supabaseAnonKey','classCode'].filter(k=>!cfg[k]);
  if(miss.length){MODE.warn='학급 서버 환경변수가 비어 있어요('+miss.join(', ')+'). 지금은 이 기기에만 저장돼요.';cfg=null}}
 if(cfg){app.innerHTML='<div class="login"><div class="login-box"><div class="logo">책의 용사<small>학급 서버에 연결하는 중이에요</small></div></div></div>';
  try{await initRemote(cfg)}catch(e){console.error(e);app.innerHTML=`<div class="login"><div class="login-box"><div class="logo" style="font-size:3rem">연결 실패<small>학급 서버에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 보세요. 계속 안 되면 선생님이 Vercel 환경변수와 Supabase 표 만들기(schema.sql)를 확인해야 해요.</small></div><p style="color:#cfd3ff" class="small">${esc(e&&(e.message||e.code)||'')}</p></div></div>`;return}}
 else loadLocal();render()}

 equip:{top:'st_tee',bottom:'st_pants',shoes:'st_shoes'},inv:['st_tee','st_pants','st_shoes'],enh:{},job:null,pendingJob:null,
 books:[],records:[],streak:{count:0,best:0,last:null},daily:{},dq:{date:null,c:[]},wq:{week:null,c:[]},ach:[],title:null,pet:null,
 stats:{pages:0,records:0,questions:0,approvedQ:0,best:0,feelChars:0,quotes:0,words:0,finished:0,morning:0,kills:0},mail:[],buffUntil:null,created:today()}}
function ensureDaily(s){const t=today();if(s.daily.date!==t)s.daily={date:t,pages:0,pagesAll:0,recs:0,words:0,kills:0,feel:0,q:0};
 if(s.dq.date!==t)s.dq={date:t,c:[]};const wk=weekKey(t);if(s.wq.week!==wk)s.wq={week:wk,c:[]}}

function weekStats(s){const wk=weekKey(today());const rs=s.records.filter(r=>weekKey(r.date)===wk);return {days:new Set(rs.map(r=>r.date)).size,quotes:rs.filter(r=>r.quote).length,pages:rs.reduce((a,r)=>a+r.pages,0)}}
function activeSets(s){const out=[];for(const k in SET_ITEMS){if(SET_ITEMS[k].every(id=>Object.values(s.equip).includes(id)))out.push(k)}return out}
function effSum(s,key){return activeSets(s).reduce((a,k)=>a+(SETS[k].eff[key]||0),0)}
const apMax=s=>30+effSum(s,'apMax');
function atkOf(s){const w=ITEM[s.equip.weapon];let a=6+s.lv*1.5;if(w){a+=w.atk*(1+0.12*(s.enh[w.id]||0));if(s.job&&JOBS[s.job.line].w===w.kind)a*=1.15}return Math.round(a*(1+effSum(s,'atkPct')/100))}

function gainExp(s,n){const ev=[];s.exp+=n;while(s.lv<100&&s.exp>=needExp(s.lv)){s.exp-=needExp(s.lv);s.lv++;s.gold+=20;let extra='';
  if(s.lv%5===0){const g=50*Math.ceil(s.lv/10);s.gold+=g;extra=`레벨 ${s.lv} 선물 상자: ${g} 골드`}
  if(s.lv%10===1&&s.lv>1)extra+=(extra?' / ':'')+`새 지역 「${REGIONS[regionOf(s.lv)].n}」이 열렸어요`;
  if(s.lv===11)extra+=(extra?' / ':'')+'펫 입양이 열렸어요';
  if(TIER_LV.includes(s.lv))extra+=(extra?' / ':'')+'전직 퀘스트를 확인하세요';
  ev.push({lv:s.lv,extra});if(extra)mail(s,`레벨 ${s.lv} 달성! ${extra}`)}
 if(s.lv>=100)s.exp=Math.min(s.exp,needExp(100));return ev}
function give(s,rw){if(rw.gold)s.gold+=rw.gold;if(rw.gems)s.gems+=rw.gems;if(rw.ap)s.ap=Math.min(apMax(s),s.ap+rw.ap);if(rw.exp)return gainExp(s,rw.exp);return[]}

 got.forEach((n,i)=>setTimeout(()=>toast(`업적 달성: ${n}`,'good'),400+i*600));return got}

function ensureBoss(){const wk=weekKey(today());const st=Object.values(S.students);const n=Math.max(1,st.length);const idx=Math.floor(parseD(wk).getTime()/604800000)%BOSSES.length;const max=200+180*n;let dmg=0;const contrib={};
 st.forEach(s=>{if(s.boss&&s.boss.week===wk){contrib[s.id]=s.boss.dmg;dmg+=s.boss.dmg}});return {week:wk,n:BOSSES[idx],idx,max,hp:Math.max(0,max-dmg),contrib}}
function myBoss(s){const wk=weekKey(today());if(!s.boss||s.boss.week!==wk)s.boss={week:wk,dmg:0,claimed:false};return s.boss}
function bossHit(s,d){const b=ensureBoss();d=Math.round(d*(1+effSum(s,'bossPct')/100));const real=Math.min(d,b.hp);myBoss(s).dmg+=real;return real}
function applyDecisions(s){let n=0;S.approvals.forEach(a=>{if(a.sid!==s.id||a.status==='wait'||a.applied)return;a.applied=true;n++;const ok=a.status==='ok';const note=a.note?' · 선생님: '+a.note:'';
 if(a.type==='q'){const r=s.records.find(x=>x.id===a.recId);if(ok){s.stats.approvedQ++;if(r)r.qStatus='ok';if(a.best){s.gems+=3;s.stats.best++;if(r)r.best=true;mail(s,`이번 주 최고의 질문으로 뽑혔어요! 지혜석 3개: "${a.text}"`)}else{s.gems+=1;mail(s,`질문이 인증됐어요! 지혜석 1개: "${a.text}"`)}}
  else{if(r)r.qStatus='no';mail(s,`질문을 다시 생각해 보면 좋겠어요: "${a.text}"${note}`)}}

function pRec(s){const act=s.books.filter(b=>!b.done);if(!cur.bookSel||!act.find(b=>b.id===cur.bookSel))cur.bookSel=act[0]?act[0].id:null;

 else form=`<form id="recform" autocomplete="off" onsubmit="return false">

 <div class="field"><label for="r-sum">한 줄 요약 <span class="pill">필수 · 20자 이상</span></label><textarea class="inp" id="r-sum" placeholder="오늘 읽은 부분에서 일어난 일을 한 문장으로 정리해요."></textarea></div>
 <div class="field"><label for="r-feel">느낀 점 <span class="pill">50자 이상 · +20 EXP</span></label><textarea class="inp" id="r-feel" placeholder="어떤 장면이 왜 기억에 남았나요? 나라면 어떻게 했을까요?"></textarea><div class="hint" id="r-feel-n"></div></div>
 <div class="field"><label for="r-q">궁금한 점 <span class="pill">+20 EXP · 선생님 인증 시 지혜석</span></label><input class="inp" id="r-q" placeholder="예: 주인공은 왜 그 비밀을 끝까지 말하지 않았을까?"><div class="hint">'왜', '만약', '어떻게'로 시작하는 질문이 좋은 질문이 되기 쉬워요.</div></div>
 <div class="field"><label for="r-quote">인상 깊은 문장 <span class="pill">+15 EXP</span></label><input class="inp" id="r-quote" placeholder="책 속 문장을 옮겨 써요."><textarea class="inp" id="r-why" style="margin-top:6px;min-height:50px" placeholder="이 문장이 마음에 남은 이유 (30자 이상)"></textarea></div>
 <div class="field words"><span class="lab">새로 알게 된 낱말 <span class="pill">낱말당 +5 EXP · 하루 3개</span></span>
 ${[0,1,2].map(i=>`<div class="row"><input class="inp" id="w${i}" placeholder="낱말" style="max-width:120px"><input class="inp" id="m${i}" placeholder="뜻 (내 말로)"></div>`).join('')}</div>
 <div class="field"><span class="lab">오늘의 기분</span><div class="moods">${MOODS.map((m,i)=>`<button type="button" class="mood ${cur.mood===i?'on':''}" data-act="mood" data-v="${i}">${m}</button>`).join('')}</div></div>
 <div class="reward" id="rwprev"></div>
 <div id="r-err" class="err" role="alert"></div>
 <button class="btn gold" style="margin-top:12px;width:100%;font-size:1.1rem" data-act="submitrec">기록하고 보상 받기</button></form>`;
 return `<h2>독서 기록</h2>
 <div class="row" style="margin-bottom:8px"><span class="small muted">오늘 보상 받은 쪽수 ${s.daily.pages}/60 · 오늘 기록 ${s.daily.recs}번</span><span class="spacer"></span><button class="btn sm teal" data-act="addbook">새 책 등록</button></div>
 ${act.length?`<div class="books" style="margin-bottom:12px">${act.map(b=>`<button class="book-chip ${b.id===cur.bookSel?'on':''}" data-act="selbook" data-id="${b.id}"><b>${esc(b.title)}</b><span class="small muted">${b.genre} · ${b.last}/${b.total}쪽</span></button>`).join('')}</div>`:''}
 ${form}
 ${recent.length?`<h3>최근 기록</h3>${recent.map(r=>{const b=s.books.find(x=>x.id===r.bookId);return `<div class="box" style="margin-bottom:8px"><div class="row small"><b style="font-family:var(--display)">${esc(b?b.title:'')}</b><span class="muted">${r.date} · ${r.from}~${r.to}쪽</span><span class="spacer"></span><span class="pill">+${r.exp} EXP</span></div><div class="small">${esc(r.summary)}</div>${r.question?`<div class="small muted">질문: ${esc(r.question)} ${r.qStatus==='ok'?'· 인증됨':r.qStatus==='no'?'· 다시 생각해 보기':'· 확인 중'}</div>`:''}</div>`}).join('')}`:''}`}
function readForm(){const v=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
 return {from:parseInt(v('r-from'),10),to:parseInt(v('r-to'),10),summary:v('r-sum'),feel:v('r-feel'),question:v('r-q'),quote:v('r-quote'),why:v('r-why'),
  words:[0,1,2].map(i=>({w:v('w'+i),m:v('m'+i)})).filter(x=>x.w||x.m),mood:cur.mood}}
function textProblem(t,min,label){const n=nonsp(t);if(n<min)return `${label}은(는) ${min}자 이상 써야 해요. (지금 ${n}자)`;
 if(/(.)\1{4,}/.test(t))return `${label}에 같은 글자를 계속 반복했어요.`;if(/[ㄱ-ㅎㅏ-ㅣ]{3,}/.test(t))return `${label}에 자음·모음만 쓴 부분이 있어요.`;
 const u=new Set(t.replace(/\s/g,'')).size;if(n>=20&&u/n<.25)return `${label}에 같은 말을 반복했어요.`;return null}
function evalRecord(s,f,bk,strict){const errs=[];const rw={exp:0,gold:0,ap:0,lines:[]};
 if(!bk){errs.push('책을 먼저 골라요.');return {errs,rw}}
 let pages=0;
 if(!(f.to>=1))errs.push('몇 쪽까지 읽었는지 적어요.');
 else if(f.to>bk.total)errs.push(`이 책은 ${bk.total}쪽까지 있어요.`);
 else if(f.to<=bk.last)errs.push(`지난번에 ${bk.last}쪽까지 읽었어요. 그 뒤로 읽은 쪽까지 적어요.`);
 else if(f.from>f.to)errs.push('시작 쪽이 끝 쪽보다 뒤에 있어요.');
 else pages=f.to-Math.max((f.from||bk.last+1)-1,bk.last);
 const sp=textProblem(f.summary,20,'한 줄 요약');if(sp)errs.push(sp);
 const fp=f.feel?textProblem(f.feel,50,'느낀 점'):null;if(fp)errs.push(fp);
 let qp=null;if(f.question){if(nonsp(f.question)<8)qp='궁금한 점은 8자 이상 써요.';else if(!/[?？]\s*$/.test(f.question))qp='궁금한 점은 물음표(?)로 끝나게 써요.';else qp=textProblem(f.question,8,'궁금한 점')}if(qp)errs.push(qp);
 let qtp=null;if(f.quote||f.why){if(nonsp(f.quote)<5)qtp='인상 깊은 문장을 5자 이상 옮겨 써요.';else qtp=textProblem(f.why,30,'문장을 고른 이유')}if(qtp)errs.push(qtp);
 const words=f.words.filter(x=>x.w&&nonsp(x.m)>=4);if(f.words.some(x=>!x.w||nonsp(x.m)<4))errs.push('낱말과 뜻(4자 이상)을 함께 적어요.');
 if(strict){const prev=s.records;['summary','feel','question'].forEach(k=>{if(f[k]&&prev.some(r=>r[k]&&r[k].replace(/\s/g,'')===f[k].replace(/\s/g,'')))errs.push(`예전 기록과 똑같은 ${({summary:'요약',feel:'느낀 점',question:'질문'})[k]}이에요. 오늘의 생각을 새로 써요.`)})}
 ensureDaily(s);const pr=Math.max(0,Math.min(pages,60-s.daily.pages));const bonusOK=s.daily.recs<2;
 if(pages>0){rw.exp+=pr;rw.gold+=pr;rw.lines.push(`읽은 쪽 ${pages}쪽 → ${pr} EXP, ${pr} 골드${pr<pages?' (하루 60쪽까지 보상)':''}`)}
 if(bonusOK){if(!sp&&f.summary){rw.exp+=10;rw.lines.push('한 줄 요약 +10 EXP')}
  if(f.feel&&!fp){rw.exp+=20;rw.gold+=20;rw.lines.push('느낀 점 +20 EXP, 20 골드')}
  if(f.question&&!qp){rw.exp+=20;rw.lines.push('궁금한 점 +20 EXP (인증되면 지혜석 1)')}
  if(f.quote&&!qtp){rw.exp+=15;rw.lines.push('인상 깊은 문장 +15 EXP')}
  const wn=Math.min(words.length,3-s.daily.words);if(wn>0){rw.exp+=wn*5;rw.lines.push(`새 낱말 ${wn}개 +${wn*5} EXP`)}
  rw.ap=3+(f.feel&&!fp?2:0)+(f.question&&!qp?2:0)+(f.quote&&!qtp?1:0);rw.lines.push(`행동력 +${rw.ap}`)}
 else if(pages>0)rw.lines.push('오늘은 글 보너스를 이미 2번 받았어요. 쪽수 보상만 받아요.');
 let mult=S.settings.expMult||1;if(buffOn(s))mult*=1.5;rw.exp=Math.round(rw.exp*mult);if(mult>1)rw.lines.push(`경험치 ×${mult}`);
 if(pages>0&&f.to>=bk.total)rw.lines.push('완독 보너스 +100 EXP · 책장에 등록');
 return {errs,rw,pages,words,okFeel:f.feel&&!fp,okQ:f.question&&!qp,okQuote:f.quote&&!qtp}}
function bindRecForm(){const fm=document.getElementById('recform');if(!fm)return;const upd=()=>{const s=me();const bk=s.books.find(b=>b.id===cur.bookSel);const r=evalRecord(s,readForm(),bk,false);
 const fe=document.getElementById('r-feel');document.getElementById('r-feel-n').textContent=fe.value.trim()?`${nonsp(fe.value)}자`:'';
 document.getElementById('rwprev').innerHTML=`<div class="big">예상 보상 ${fmt(r.rw.exp)} EXP · ${fmt(r.rw.gold)} 골드</div>${r.rw.lines.length?`<ul>${r.rw.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:'<ul><li>쪽수와 한 줄 요약을 쓰면 보상이 계산돼요.</li></ul>'}`};
 fm.addEventListener('input',upd);upd()}
function submitRecord(){const s=me();const bk=s.books.find(b=>b.id===cur.bookSel);const f=readForm();const r=evalRecord(s,f,bk,true);
 const eb=document.getElementById('r-err');if(r.errs.length){eb.innerHTML=r.errs.map(esc).join('<br>');eb.scrollIntoView({block:'center',behavior:'smooth'});return}
 if(r.pages<1){eb.textContent='읽은 쪽수를 확인해요.';return}
 const t=today();ensureDaily(s);
 // streak
 const st=s.streak;let streakMsg='';
 if(st.last!==t){let cont=false;if(st.last){cont=true;for(let d=addDays(st.last,1);d<t;d=addDays(d,1))if(!isWeekend(d)){cont=false;break}
   if(daysBetween(st.last,t)>=4){s.buffUntil=addDays(t,1);streakMsg='돌아온 용사 버프! 오늘과 내일 경험치 1.5배. '}}
  st.count=cont?st.count+1:1;st.last=t;st.best=Math.max(st.best,st.count);
  if(STREAK_RW[st.count]){give(s,STREAK_RW[st.count]);streakMsg+=`연속 ${st.count}일 상자: ${rwText(STREAK_RW[st.count])}`;mail(s,`연속 기록 ${st.count}일 달성! ${rwText(STREAK_RW[st.count])}`)}}
 if(buffOn(s)&&!/1\.5/.test(r.rw.lines.join(''))){r.rw.exp=Math.round(r.rw.exp*1.5)}
 const bonusOK=s.daily.recs<2;
 const rec={id:uid(),date:t,bookId:bk.id,from:bk.last+1>f.from?bk.last+1:f.from,to:f.to,pages:r.pages,summary:f.summary,feel:r.okFeel?f.feel:'',question:r.okQ?f.question:'',qStatus:r.okQ?'wait':null,
  quote:r.okQuote?f.quote:'',why:r.okQuote?f.why:'',words:r.words,mood:f.mood,exp:r.rw.exp,ts:Date.now()};
 s.records.push(rec);
 // stats
 const pr=Math.max(0,Math.min(r.pages,60-s.daily.pages));s.daily.pages+=pr;s.daily.pagesAll+=r.pages;s.daily.recs++;
 if(bonusOK){s.daily.words+=Math.min(r.words.length,3-s.daily.words)}
 if(rec.feel)s.daily.feel=1;if(rec.question)s.daily.q=1;
 const S2=s.stats;S2.records++;S2.pages+=r.pages;if(rec.question)S2.questions++;if(rec.feel)S2.feelChars+=nonsp(rec.feel);if(rec.quote)S2.quotes++;S2.words+=r.words.length;if(new Date().getHours()<9)S2.morning++;
 bk.last=f.to;
 let ev=give(s,{exp:r.rw.exp,gold:r.rw.gold,ap:r.rw.ap});
 let extra=[];
 if(f.to>=bk.total){bk.done=true;bk.doneAt=t;S2.finished++;const firstGenre=s.books.filter(b=>b.done&&b.genre===bk.genre).length===1;
  ev=ev.concat(gainExp(s,Math.round(100*(S.settings.expMult||1))));extra.push('완독! 책장에 표지가 꽂혔어요.');
  if(firstGenre){s.gems+=3;extra.push(`새 장르 「${bk.genre}」 첫 완독: 지혜석 3개`)}
  mail(s,`「${bk.title}」 완독! 책장에서 완독 미션(추천사 쓰기)을 하면 지혜석 2개를 받을 수 있어요.`)}
 if(rec.question)S.approvals.push({id:uid(),sid:s.id,type:'q',recId:rec.id,text:rec.question,book:bk.title,summary:rec.summary,date:t,status:'wait'});
 const dmg=r.pages+(rec.feel?10:0)+(rec.question?10:0);const done=bossHit(s,dmg);
 if(s.pet){s.pet.exp+=Math.max(1,Math.round((1+Math.floor(r.pages/10))*(1+effSum(s,'petPct')/100)))}
 checkAch(s);save();
 cur.mood=null;
 const bodyLines=r.rw.lines.map(l=>`<li>${esc(l)}</li>`).join('');
 modal(`<h2>기록 완료!</h2><div class="reward"><div class="big">+${fmt(r.rw.exp)} EXP · +${fmt(r.rw.gold)} 골드</div><ul>${bodyLines}<li>학급 보스에게 ${done} 피해</li>${streakMsg?`<li>${esc(streakMsg)}</li>`:''}${extra.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  ${rec.question?'<p class="small">질문은 선생님께 전달됐어요. 인증되면 지혜석을 받아요.</p>':''}<div class="foot"><button class="btn gold" data-act="closemodal">좋아요</button></div>`);
 render();cur.pendingLv=ev}

/* ---- shop ---- */
function slotFilter(sel,act){return `<div class="row" style="margin-bottom:10px"><button class="chip ${sel==='all'?'on':''}" data-act="${act}" data-v="all">전체</button>${Object.entries(SLOTS).map(([k,n])=>`<button class="chip ${sel===k?'on':''}" data-act="${act}" data-v="${k}">${n}</button>`).join('')}</div>`}
function itemMeta(i){const bits=[`${gradeTag(i.g)} Lv ${i.lv}`];if(i.atk)bits.push(`공격력 ${i.atk}`);if(i.set)bits.push(SETS[i.set].n);return bits.join(' · ')}
function pShop(s){const list=ITEMS.filter(i=>!i.job&&!i.starter&&(cur.shopSlot==='all'||i.slot===cur.shopSlot)).sort((a,b)=>a.lv-b.lv||a.g-b.g);
 return `<h2>상점</h2><p class="small muted" style="margin-top:-4px">입어보기로 무대 위 캐릭터에게 먼저 걸쳐 볼 수 있어요. 모든 아이템은 뽑기 없이 정해진 값으로 살 수 있어요.</p>${slotFilter(cur.shopSlot,'shopslot')}
 <div class="items">${list.map(i=>{const own=s.inv.includes(i.id);const lock=s.lv<i.lv;return `<div class="item gb${i.g}"><div class="thumb">${charOf(s,{[i.slot]:i.id})}</div><div class="nm gr${i.g}">${esc(i.n)}</div><div class="meta">${itemMeta(i)}<br>${SLOTS[i.slot]}</div>
 <div class="act">${own?'<span class="pill">보유 중</span>':`<button class="btn sm gold" data-act="buy" data-id="${i.id}" ${lock?'disabled':''}>${lock?`Lv ${i.lv} 필요`:priceTag(i)}</button>`}<button class="btn sm ghost" data-act="try" data-id="${i.id}">입어보기</button></div></div>`}).join('')}</div>`}

/* ---- wardrobe ---- */
function pWard(s){const owned=s.inv.map(id=>ITEM[id]).filter(i=>i&&(cur.wardSlot==='all'||i.slot===cur.wardSlot)).sort((a,b)=>a.g-b.g||a.lv-b.lv);
 const w=s.equip.weapon?ITEM[s.equip.weapon]:null;const e=w?(s.enh[w.id]||0):0;const cost=w?Math.round((50+w.g*150)*Math.pow(e+1,1.6)):0;
 const sets=Object.keys(SETS).map(k=>{const ids=SET_ITEMS[k]||[];const have=ids.filter(id=>s.inv.includes(id)).length;const on=activeSets(s).includes(k);return `<div class="q"><div class="qt"><b>${SETS[k].n}</b><span class="small muted">${SETS[k].t} · 보유 ${have}/${ids.length}${on?' · 효과 발동 중':' · 모두 장착하면 효과 발동'}</span>${bar(have,ids.length)}</div></div>`}).join('');
 const lookBtn=(arr,key,cost)=>arr.map(([v,n])=>`<button class="chip ${s.look[key]===v?'on':''}" data-act="relook" data-k="${key}" data-v="${v}" data-c="${cost}">${n}</button>`).join('');
 const lookSw=(arr,key,cost)=>arr.map((c,i)=>`<button class="sw ${s.look[key]===i?'on':''}" style="background:${c}" data-act="relook" data-k="${key}" data-v="${i}" data-c="${cost}" aria-label="색 ${i+1}"></button>`).join('');
 return `<h2>옷장</h2>${slotFilter(cur.wardSlot,'wardslot')}
 <div class="items">${owned.map(i=>{const on=s.equip[i.slot]===i.id;const lock=s.lv<SLOT_LV[i.slot];return `<div class="item gb${i.g} ${on?'eq':''}"><div class="thumb">${charOf(s,{[i.slot]:i.id})}</div><div class="nm gr${i.g}">${esc(i.n)}${i.atk&&s.enh[i.id]?` +${s.enh[i.id]}`:''}</div><div class="meta">${itemMeta(i)}<br>${SLOTS[i.slot]}</div>
 <div class="act">${on?`<button class="btn sm ghost" data-act="unequip" data-slot="${i.slot}">벗기</button>`:`<button class="btn sm teal" data-act="equip" data-id="${i.id}" ${lock?'disabled':''}>${lock?`Lv ${SLOT_LV[i.slot]} 슬롯`:'장착'}</button>`}</div></div>`}).join('')||'<div class="empty"><b>이 칸에 가진 옷이 없어요</b>상점에서 골드로 살 수 있어요.</div>'}</div>
 <h3>무기 강화</h3>${w?`<div class="box row"><div style="flex:1"><b style="font-family:var(--display)">${esc(w.n)} +${e}</b><div class="small muted">강화할수록 공격력 +12%씩. +5부터 빛나고, +10이면 특별한 빛이 나요. 실패 없이 반드시 성공해요.</div></div>${e>=10?'<span class="pill">최대 강화</span>':`<button class="btn gold sm" data-act="enhance" ${s.gold<cost?'disabled':''}>+${e+1} 강화 ${ICO.gold}${fmt(cost)}</button>`}</div>`:'<div class="box small muted">무기를 장착하면 강화할 수 있어요.</div>'}
 <h3>세트 수집</h3>${sets}
 <h3>외모 바꾸기</h3><div class="box stack"><div><span class="lab">머리 모양 · ${ICO.gold}100</span><div class="row">${lookBtn(HAIRS,'hair',100)}</div></div><div><span class="lab">머리 색 (염색) · ${ICO.gold}50</span><div class="swatches">${lookSw(HAIRC,'hairColor',50)}</div></div><div><span class="lab">눈 · ${ICO.gold}50</span><div class="row">${lookBtn(EYES,'eyes',50)}</div></div></div>`}

/* ---- job ---- */
function pJob(s){const J=s.job;let head='';
 if(s.pendingJob){const P=s.pendingJob;head=`<div class="box"><b style="font-family:var(--display)">「${JOBS[P.line].tiers[P.tier]}」 전직 심사 중</b><div class="small muted">선생님이 전직 퀘스트를 확인하면 전직이 완료돼요.</div></div>`}
 else if(!J){head=s.lv<10?`<div class="box"><b style="font-family:var(--display)">레벨 10에 첫 전직을 할 수 있어요</b><div class="small muted">지금 레벨 ${s.lv}. 아래 다섯 계열 중 어떤 용사가 되고 싶은지 미리 골라 두세요.</div>${bar(s.lv,10)}</div>`
  :`<div class="box"><b style="font-family:var(--display)">1차 전직을 할 수 있어요!</b><div class="small muted">계열을 고르고 전직 퀘스트를 쓰면 선생님 확인 뒤 전직해요.</div></div>`}
 else{const L=JOBS[J.line];const nt=J.tier+1;if(nt>3)head=`<div class="box"><b style="font-family:var(--display)">${L.tiers[J.tier]}</b><div class="small">모든 전직을 마친 최고의 용사예요.</div></div>`;
  else{const c=L.cond[nt];const v=c.f(s);const lvOK=s.lv>=TIER_LV[nt],cOK=v>=c.g;
   head=`<div class="box"><div class="row"><div><div class="small muted">현재 직업</div><b style="font-family:var(--display);font-size:1.3rem;color:${L.col}">${L.tiers[J.tier]}</b></div><span class="spacer"></span><div class="small muted" style="text-align:right">다음 전직<br><b style="font-family:var(--display);color:var(--text)">${L.tiers[nt]}</b></div></div>
   <div class="small" style="margin-top:8px">레벨 ${s.lv} / ${TIER_LV[nt]}</div>${bar(s.lv,TIER_LV[nt])}<div class="small" style="margin-top:6px">${c.t} ${fmt(v)} / ${fmt(c.g)}${c.u}</div>${bar(v,c.g)}
   ${lvOK&&cOK?`<button class="btn gold" style="margin-top:10px" data-act="jobmission" data-line="${J.line}" data-tier="${nt}">전직 퀘스트 쓰기</button>`:''}</div>`}}
 const canPick=!J&&!s.pendingJob&&s.lv>=10;
 return `<h2>전직</h2>${head}<h3>다섯 계열</h3><div class="jobs">${Object.entries(JOBS).map(([k,L])=>`<div class="job ${J&&J.line===k?'mine':''}"><h4 style="color:${L.col}">${L.n} 계열</h4><div class="small muted">${L.d}</div><ol>${L.tiers.map((t,i)=>`<li>${t} <span class="muted">Lv ${TIER_LV[i]}${i?` · ${L.cond[i].t} ${fmt(L.cond[i].g)}${L.cond[i].u}`:''}</span></li>`).join('')}</ol><div class="small muted">주무기: ${({sword:'검',staff:'지팡이',magnifier:'돋보기',quill:'깃펜',dagger:'쌍검'})[L.w]} (같은 종류 무기를 들면 공격력 +15%)</div>
 ${canPick?`<button class="btn sm teal" style="margin-top:8px" data-act="jobmission" data-line="${k}" data-tier="0">이 계열로 전직</button>`:''}</div>`).join('')}</div>`}

/* ---- quests ---- */
function pQuest(s){ensureDaily(s);const qrow=(q,list,kind)=>{const v=q.f(s),done=v>=q.g,got=list.includes(q.id);return `<div class="q"><div class="qt"><b>${q.n}</b><span class="small muted">${rwText(q.rw)}</span>${bar(v,q.g)}</div>${got?'<span class="pill">받음</span>':`<button class="btn sm gold" data-act="claimq" data-id="${q.id}" data-k="${kind}" ${done?'':'disabled'}>${done?'받기':`${Math.min(v,q.g)}/${q.g}`}</button>`}</div>`};
 const st=s.streak;const nextM=Object.keys(STREAK_RW).map(Number).find(n=>n>st.count);
 return `<h2>퀘스트</h2><h3>오늘의 퀘스트</h3>${DQ.map(q=>qrow(q,s.dq.c,'d')).join('')}
 <h3>이번 주 퀘스트</h3>${WQ.map(q=>qrow(q,s.wq.c,'w')).join('')}
 <h3>연속 기록</h3><div class="box"><b style="font-family:var(--display);font-size:1.3rem">${st.count}일 연속</b> <span class="small muted">최고 ${st.best}일 · 주말은 쉬어도 이어져요</span>${nextM?`<div class="small" style="margin-top:6px">${nextM}일 달성 시 ${rwText(STREAK_RW[nextM])}</div>${bar(st.count,nextM)}`:''}</div>
 <h3>업적과 칭호</h3><p class="small muted" style="margin-top:-4px">달성한 업적은 칭호로 달 수 있어요. 칭호는 이름 위에 보여요.</p>
 <div class="achs">${ACH.map(([id,n,d])=>{const got=s.ach.includes(id);return `<div class="ach ${got?'got':''}"><b>${n}</b>${d}${got?`<div style="margin-top:4px">${s.title===n?`<button class="btn sm ghost" data-act="title" data-v="">칭호 떼기</button>`:`<button class="btn sm teal" data-act="title" data-v="${esc(n)}">칭호 달기</button>`}</div>`:''}</div>`}).join('')}</div>`}

function pShelf(s){const done=s.books.filter(b=>b.done);const fg=finishedGenres(s);const P=[100,500,1000,3000,5000];

 <h3>읽는 중인 책</h3>${s.books.filter(b=>!b.done).map(b=>`<div class="q"><div class="qt"><b>${esc(b.title)}</b><span class="small muted">${esc(b.author||'')} · ${b.genre} · ${b.last}/${b.total}쪽</span>${bar(b.last,b.total)}</div></div>`).join('')||'<p class="small muted">읽는 중인 책이 없어요.</p>'}`}

/* ================= teacher ================= */
function renderTeacher(){const pend=S.approvals.filter(a=>a.status==='wait');const T=[['appr',`승인 대기 ${pend.length}`],['stu','학생 현황'],['qs','질문 모아보기'],['set','설정']];
 app.innerHTML=`<div class="teacher-head"><h1 style="font-size:1.4rem">선생님 모드 · ${esc(S.settings.className)}</h1><span class="spacer"></span><button class="btn sm ghost" style="color:#fff;border-color:#ffffff40" data-act="logout">나가기</button></div>
 <div class="teacher-main"><nav class="tabs">${T.map(([k,n])=>`<button class="tab ${cur.ttab===k?'on':''}" data-act="ttab" data-t="${k}">${n}</button>`).join('')}</nav><div class="panel">${({appr:tAppr,stu:tStu,qs:tQs,set:tSet})[cur.ttab]()}</div></div>`}

function tAppr(){const pend=S.approvals.filter(a=>a.status==='wait');if(!pend.length)return `<div class="empty"><b>확인할 항목이 없어요</b>학생이 질문, 완독 추천사, 전직 퀘스트를 쓰면 여기에 모여요.</div>`;
 return `<h2>승인 대기</h2><p class="small muted">질문을 인증하면 지혜석 1개(최고의 질문은 3개), 완독 미션은 2개, 전직 퀘스트는 전직과 직업 아이템이 지급돼요. 보상은 학생이 게임에 접속할 때 들어가요.</p>`+pend.map(a=>{const s=S.students[a.sid];if(!s)return '';
 return `<div class="appr"><div class="row"><span class="pill">${TYPE_N[a.type]}</span><b style="font-family:var(--display)">${s.num}번 ${esc(s.nick)}</b><span class="small muted">${a.date}${a.book?' · 「'+esc(a.book)+'」':''}${a.type==='job'?' · '+JOBS[a.line].tiers[a.tier]:''}</span></div>
 ${a.summary?`<div class="small muted" style="margin-top:4px">요약: ${esc(a.summary)}</div>`:''}${a.prompt?`<div class="small muted" style="margin-top:4px">퀘스트: ${esc(a.prompt)}</div>`:''}<div class="txt">${esc(a.text)}</div>
 <div class="row"><button class="btn sm teal" data-act="approve" data-id="${a.id}">승인</button>${a.type==='q'?`<button class="btn sm gold" data-act="approve" data-id="${a.id}" data-best="1">최고의 질문으로 승인</button>`:''}<button class="btn sm ghost" data-act="reject" data-id="${a.id}">다시 써 보기로 돌려보내기</button></div></div>`}).join('')}
function tStu(){const st=Object.values(S.students).sort((a,b)=>a.num-b.num);if(!st.length)return `<div class="empty"><b>등록된 학생이 없어요</b>학생들이 첫 화면에서 새 용사를 만들면 여기에 나타나요.</div>`;const t=today();
 return `<h2>학생 현황</h2><p class="small muted">행을 누르면 자세히 보기, 보상 지급, 비밀번호 초기화를 할 수 있어요.</p><div class="row" style="margin-bottom:8px"><button class="btn sm teal" data-act="csv" data-k="stu">학생 현황 CSV</button><button class="btn sm teal" data-act="csv" data-k="rec">전체 독서 기록 CSV</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>번호</th><th>닉네임</th><th>Lv</th><th>직업</th><th>누적 쪽</th><th>기록</th><th>완독</th><th>질문(인증)</th><th>연속/최고</th><th>최근 기록</th></tr></thead><tbody>
 ${st.map(s=>{const last=s.records.length?s.records[s.records.length-1].date:'-';return `<tr class="click" data-act="stuinfo" data-id="${s.id}" tabindex="0"><td>${s.num}</td><td>${esc(s.nick)}</td><td>${s.lv}</td><td>${s.job?JOBS[s.job.line].tiers[s.job.tier]:'-'}</td><td>${fmt(s.stats.pages)}</td><td>${s.stats.records}</td><td>${s.stats.finished}</td><td>${s.stats.questions}(${s.stats.approvedQ})</td><td>${s.streak.count}/${s.streak.best}</td><td style="color:${last===t?'var(--ok)':'inherit'}">${last===t?'오늘':last}</td></tr>`}).join('')}</tbody></table></div>`}
function tQs(){const all=[];Object.values(S.students).forEach(s=>s.records.forEach(r=>{if(r.question){const b=s.books.find(x=>x.id===r.bookId);all.push({s,r,book:b?b.title:''})}}));
 if(!all.length)return `<div class="empty"><b>아직 모인 질문이 없어요</b>학생들이 기록에 궁금한 점을 쓰면 책별로 모여요. 수업 발문이나 토론 주제로 활용해 보세요.</div>`;

function tSet(){return `<h2>설정</h2><div class="stack">
 <div class="box"><span class="lab">학급 이름</span><div class="row"><input class="inp" id="t-cls" value="${esc(S.settings.className)}" style="max-width:260px"><button class="btn sm teal" data-act="setcls">저장</button></div></div>
 <div class="box"><span class="lab">더블 EXP 데이</span><div class="row"><span class="small muted" style="flex:1">켜 두면 모든 독서 기록 경험치가 2배가 돼요. 독서의 달, 행사 날에 써 보세요.</span><button class="btn sm ${S.settings.expMult>1?'ruby':'gold'}" data-act="dbl">${S.settings.expMult>1?'끄기':'켜기'}</button></div></div>
 <div class="box"><span class="lab">선생님 비밀번호</span><div class="row"><input class="inp" id="t-pin" inputmode="numeric" maxlength="8" placeholder="새 비밀번호 4~8자리" style="max-width:220px"><button class="btn sm teal" data-act="setpin">바꾸기</button></div>${S.settings.teacherPinH===hpin('0000')?'<div class="err">처음 비밀번호 0000을 쓰고 있어요. 학생들이 알기 전에 바꿔 주세요.</div>':''}</div>

 <div class="box"><span class="lab">전체 초기화</span><div class="row"><span class="small muted" style="flex:1">모든 학생과 기록을 지웁니다. 되돌릴 수 없어요.</span><button class="btn sm ruby" data-act="wipe">초기화</button></div></div></div>`}
function stuInfo(id){const s=S.students[id];modal(`<h2>${s.num}번 ${esc(s.nick)}</h2><div class="row" style="align-items:flex-start"><div style="width:110px">${charOf(s)}</div><div class="small" style="flex:1">Lv ${s.lv} · ${s.job?JOBS[s.job.line].tiers[s.job.tier]:'직업 없음'}<br>골드 ${fmt(s.gold)} · 지혜석 ${s.gems}<br>누적 ${fmt(s.stats.pages)}쪽 · 완독 ${s.stats.finished}권<br>느낀 점 ${fmt(s.stats.feelChars)}자 · 새 낱말 ${s.stats.words}개</div></div>
 <h3>최근 기록</h3>${s.records.slice(-4).reverse().map(r=>`<div class="box small" style="margin-bottom:6px">${r.date} · ${r.from}~${r.to}쪽<br>${esc(r.summary)}${r.feel?`<br><span class="muted">${esc(r.feel)}</span>`:''}</div>`).join('')||'<p class="small muted">기록 없음</p>'}
 <h3>보상 지급</h3><div class="row"><input class="inp" id="g-gold" type="number" min="0" placeholder="골드" style="width:100px"><input class="inp" id="g-gem" type="number" min="0" placeholder="지혜석" style="width:100px"><input class="inp" id="g-why" placeholder="이유 (학생 우편함에 표시)" style="flex:1;min-width:140px"><button class="btn sm gold" data-act="gift" data-id="${id}">지급</button></div>
 <div class="foot"><button class="btn sm ghost" data-act="resetpin" data-id="${id}">비밀번호 0000으로 초기화</button><button class="btn sm ruby" data-act="delstu" data-id="${id}">학생 삭제</button><button class="btn sm" data-act="closemodal">닫기</button></div>`)}
async function exportFile(name,text){let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:name,data:'\uFEFF'+text});return}catch(e){if(e&&e.code==='declined')return}}
 modal(`<h2>${esc(name)}</h2><p class="small muted">아래 내용을 모두 복사해 메모장에 붙여 넣고 .csv로 저장하면 엑셀에서 열 수 있어요.</p><textarea class="inp" style="min-height:240px;font-size:.8rem" readonly>${esc(text)}</textarea><div class="foot"><button class="btn" data-act="closemodal">닫기</button></div>`)}
const csvCell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

/* ================= actions ================= */
function askPin(title,cb){modal(`<h2>${esc(title)}</h2><div class="field"><label for="pin-in">비밀번호</label><input class="inp" id="pin-in" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div><div id="pin-err" class="err"></div><div class="foot"><button class="btn ghost" data-act="closemodal">취소</button><button class="btn gold" data-act="pinok">확인</button></div>`);
 pinCb=cb;document.getElementById('pin-in').addEventListener('keydown',e=>{if(e.key==='Enter')doPin()})}
let pinCb=null;
function doPin(){const v=document.getElementById('pin-in').value.trim();if(pinCb&&pinCb(v)===false){document.getElementById('pin-err').textContent='비밀번호가 맞지 않아요.';return}closeModal()}

const A={
 pick:d=>{const s=S.students[d.id];askPin(`${s.num}번 ${s.nick}`,v=>{if(hpin(v)!==s.pinH)return false;cur.sid=s.id;if(applyDecisions(s))save();cur.tab='adv';cur.hunt=null;cur.region=null;cur.preview=null;setTimeout(()=>{render();const un=s.mail.filter(m=>!m.read).length;if(un)toast(`우편함에 새 소식 ${un}개`,'good')},0)})},
 newhero:()=>{cur.create={look:{skin:0,hair:'short',hairColor:0,eyes:'dot'}};render()},
 cancelcreate:()=>{cur.create=null;render()},
 look:d=>{keepCreateInputs();const k=d.k;cur.create.look[k]=(k==='skin'||k==='hairColor')?Number(d.v):d.v;render()},
 makehero:()=>{keepCreateInputs();const c=cur.create;const err=document.getElementById('c-err');const num=parseInt(c.num,10);const nick=(c.nick||'').trim();
  if(!(num>=1&&num<=40))return err.textContent='번호를 1~40 사이로 적어요.';
  if(Object.values(S.students).some(s=>s.num===num))return err.textContent=`${num}번 용사가 이미 있어요. 선생님께 확인해 주세요.`;
  if(nick.length<2)return err.textContent='닉네임은 2자 이상이에요.';
  if(!/^\d{4}$/.test(c.pin||''))return err.textContent='비밀번호는 숫자 4자리예요.';
  const s=newStudent({num,nick,pin:c.pin,look:c.look});S.students[s.id]=s;mail(s,'리브라리아에 온 것을 환영해요! 독서 기록 탭에서 읽고 있는 책을 등록하고 첫 기록을 남겨 보세요.');save();
  cur.create=null;cur.sid=s.id;cur.tab='rec';render();toast('용사 탄생! 첫 책을 등록해 보세요.','good')},
 teacherlogin:()=>askPin('선생님 모드',v=>{if(hpin(v)!==S.settings.teacherPinH)return false;cur.teacher=true;cur.ttab='appr';setTimeout(render,0)}),
 pinok:()=>doPin(),
 logout:()=>{cur.sid=null;cur.teacher=false;cur.hunt=null;cur.preview=null;render()},
 closemodal:()=>closeModal(),
 tab:d=>{cur.tab=d.t;if(d.t!=='shop')cur.preview=null;renderGame()},
 mail:()=>{const s=me();const html=s.mail.length?s.mail.map(m=>`<div class="box small" style="margin-bottom:6px;${m.read?'':'border-color:var(--gold)'}"><span class="muted">${m.t}</span><br>${esc(m.text)}</div>`).join(''):'<div class="empty"><b>우편함이 비어 있어요</b>레벨업, 업적, 선생님 소식이 여기에 와요.</div>';
  s.mail.forEach(m=>m.read=true);save();modal(`<h2>우편함</h2>${html}<div class="foot"><button class="btn" data-act="closemodal">닫기</button></div>`);renderGame()},
 region:d=>{cur.region=Number(d.r);cur.hunt=null;renderStage();renderPanel()},
 find:()=>{const s=me();const r=cur.region!=null?cur.region:regionOf(s.lv);const mi=Math.random()<.5?0:1;const max=Math.round(30*(1+r*1.6));cur.hunt={r,mi,hp:max,max};renderStage();renderPanel()},
 flee:()=>{cur.hunt=null;renderStage();renderPanel()},
 attack:()=>{const s=me();const h=cur.hunt;if(!h)return;if(s.ap<1)return toast('행동력이 없어요. 독서 기록으로 채워요.','bad');s.ap--;
  const crit=Math.random()<.1;const d=Math.max(1,Math.round(atkOf(s)*(.85+Math.random()*.3)*(crit?1.8:1)));h.hp=Math.max(0,h.hp-d);cur.anim='lunge';cur.dmg={v:d,crit};
  if(h.hp===0){ensureDaily(s);const r=h.r;const gold=Math.round((10+r*8)*(1+effSum(s,'goldPct')/100));const ex=Math.round((2+r)*(1+effSum(s,'huntExp')/100));
   s.gold+=gold;s.daily.kills++;s.stats.kills++;const ev=gainExp(s,ex);checkAch(s);save();renderStage();
   setTimeout(()=>{cur.hunt=null;toast(`${REGIONS[r].mobs[h.mi][0]} 처치! ${gold} 골드, ${ex} EXP`,'good');renderGame();if(ev.length)showLevelUps(ev)},650);return}
  save();renderStage();setTimeout(()=>{const m=document.querySelector('.mob');if(m)m.classList.add('hit')},30);renderPanel();
  const hud=document.querySelector('.cur');if(hud)hud.children[2].innerHTML=`${ICO.ap}${s.ap}/${apMax(s)}`},
 bossclaim:()=>{const s=me();const b=ensureBoss();if(b.hp>0||myBoss(s).claimed)return;myBoss(s).claimed=true;s.gold+=100;s.gems+=1;mail(s,`${b.n} 토벌 보상: 100 골드, 지혜석 1`);save();toast('토벌 보상을 받았어요!','good');renderGame()},
 adopt:()=>{modal(`<h2>책벌레 알 입양</h2><p class="small">알에게 이름을 지어 주세요. 기록할 때마다 책 간식을 먹고 자라요.</p><input class="inp" id="pet-n" maxlength="8" placeholder="펫 이름"><div class="foot"><button class="btn ghost" data-act="closemodal">취소</button><button class="btn gold" data-act="adoptok">입양하기</button></div>`)},
 adoptok:()=>{const n=document.getElementById('pet-n').value.trim();if(n.length<1)return;const s=me();s.pet={name:n,exp:0,born:today()};save();closeModal();renderGame();toast(`${n}와(과) 함께하게 됐어요!`,'good')},
 addbook:()=>{modal(`<h2>새 책 등록</h2><div class="field"><label for="b-t">제목</label><input class="inp" id="b-t" maxlength="40"></div><div class="field"><label for="b-a">지은이</label><input class="inp" id="b-a" maxlength="30"></div>
  <div class="grid2"><div class="field"><label for="b-g">장르</label><select class="inp" id="b-g">${GENRES.map(g=>`<option>${g}</option>`).join('')}</select></div><div class="field"><label for="b-p">총 쪽수</label><input class="inp" id="b-p" type="number" min="10" max="2000"></div></div>
  <div class="err" id="b-err"></div><div class="foot"><button class="btn ghost" data-act="closemodal">취소</button><button class="btn gold" data-act="addbookok">등록하기</button></div>`)},
 addbookok:()=>{const t=document.getElementById('b-t').value.trim(),a=document.getElementById('b-a').value.trim(),g=document.getElementById('b-g').value,p=parseInt(document.getElementById('b-p').value,10);const e=document.getElementById('b-err');
  if(t.length<1)return e.textContent='제목을 적어요.';if(!(p>=10&&p<=2000))return e.textContent='총 쪽수를 10~2000 사이로 적어요. 책 맨 뒤 쪽 번호를 보면 알 수 있어요.';
  const s=me();if(s.books.some(b=>!b.done&&b.title===t))return e.textContent='같은 제목의 책을 이미 읽고 있어요.';
  const b={id:uid(),title:t,author:a,genre:g,total:p,last:0,done:false,added:today()};s.books.push(b);cur.bookSel=b.id;save();closeModal();renderPanel();toast('책을 등록했어요. 오늘 읽은 만큼 기록해 보세요.','good')},
 selbook:d=>{cur.bookSel=d.id;renderPanel()},
 mood:(d,el)=>{cur.mood=Number(d.v);document.querySelectorAll('.mood').forEach(m=>m.classList.toggle('on',m===el))},
 submitrec:()=>submitRecord(),
 shopslot:d=>{cur.shopSlot=d.v;renderPanel()},
 wardslot:d=>{cur.wardSlot=d.v;renderPanel()},
 try:d=>{cur.preview=d.id;renderStage();if(window.innerWidth<900)document.getElementById('stage').scrollIntoView({behavior:'smooth'})},
 unpreview:()=>{cur.preview=null;renderStage()},
 buy:d=>{const s=me();const i=ITEM[d.id];if(s.inv.includes(i.id))return;if(s.lv<i.lv)return toast(`레벨 ${i.lv}부터 살 수 있어요.`,'bad');
  if(s.gold<i.price||s.gems<i.gem)return toast(`${s.gold<i.price?`골드가 ${fmt(i.price-s.gold)} 부족해요.`:`지혜석이 ${i.gem-s.gems}개 부족해요.`}`,'bad');
  s.gold-=i.price;s.gems-=i.gem;s.inv.push(i.id);if(s.lv>=SLOT_LV[i.slot])s.equip[i.slot]=i.id;cur.preview=null;save();toast(`${i.n}을(를) 샀어요! 바로 장착했어요.`,'good');renderGame()},
 equip:d=>{const s=me();const i=ITEM[d.id];if(s.lv<SLOT_LV[i.slot])return;s.equip[i.slot]=i.id;save();renderGame()},
 unequip:d=>{const s=me();delete s.equip[d.slot];save();renderGame()},
 enhance:()=>{const s=me();const w=ITEM[s.equip.weapon];if(!w)return;const e=s.enh[w.id]||0;if(e>=10)return;const cost=Math.round((50+w.g*150)*Math.pow(e+1,1.6));if(s.gold<cost)return toast('골드가 부족해요.','bad');
  s.gold-=cost;s.enh[w.id]=e+1;save();toast(`${w.n} +${e+1} 강화 성공!`,'good');renderGame()},
 relook:d=>{const s=me();const k=d.k;const v=(k==='hairColor')?Number(d.v):d.v;if(s.look[k]===v)return;const c=Number(d.c);if(s.gold<c)return toast('골드가 부족해요.','bad');s.gold-=c;s.look[k]=v;save();renderGame()},
 jobmission:d=>{const line=d.line,tier=Number(d.tier);const L=JOBS[line];modal(`<h2>${L.tiers[tier]} 전직 퀘스트</h2><p>${esc(mission(line,tier))}</p><textarea class="inp" id="jm" style="min-height:140px" placeholder="80자 이상 써요."></textarea><div class="err" id="jm-err"></div><div class="foot"><button class="btn ghost" data-act="closemodal">취소</button><button class="btn gold" data-act="jobsubmit" data-line="${line}" data-tier="${tier}">선생님께 보내기</button></div>`)},
 jobsubmit:d=>{const t=document.getElementById('jm').value.trim();const p=textProblem(t,80,'전직 퀘스트');if(p)return document.getElementById('jm-err').textContent=p;const s=me();const tier=Number(d.tier);
  s.pendingJob={line:d.line,tier};S.approvals.push({id:uid(),sid:s.id,type:'job',line:d.line,tier,prompt:mission(d.line,tier),text:t,date:today(),status:'wait'});save();closeModal();renderPanel();toast('전직 퀘스트를 보냈어요. 선생님 확인을 기다려요.','good')},
 claimq:d=>{const s=me();ensureDaily(s);const q=(d.k==='d'?DQ:WQ).find(x=>x.id===d.id);const list=d.k==='d'?s.dq.c:s.wq.c;if(list.includes(q.id)||q.f(s)<q.g)return;list.push(q.id);const ev=give(s,q.rw);save();toast(`${q.n} 완료! ${rwText(q.rw)}`,'good');renderGame();if(ev.length)showLevelUps(ev)},
 title:d=>{const s=me();s.title=d.v||null;save();renderGame()},
 bookinfo:d=>{const s=me();const b=s.books.find(x=>x.id===d.id);const rs=s.records.filter(r=>r.bookId===b.id);modal(`<h2>${esc(b.title)}</h2><p class="small muted">${esc(b.author||'')} · ${b.genre} · ${b.total}쪽 · ${b.doneAt||''} 완독</p>${b.mission?`<div class="box small">추천사: ${esc(b.mission)}</div>`:''}<h3>이 책의 기록 ${rs.length}개</h3>${rs.map(r=>`<div class="box small" style="margin-bottom:6px">${r.date} · ${r.from}~${r.to}쪽<br>${esc(r.summary)}${r.question?`<br><span class="muted">질문: ${esc(r.question)}</span>`:''}</div>`).join('')}<div class="foot"><button class="btn" data-act="closemodal">닫기</button></div>`)},
 finmission:d=>{const s=me();const b=s.books.find(x=>x.id===d.id);modal(`<h2>「${esc(b.title)}」 추천사</h2><p class="small">이 책을 친구에게 추천하는 글을 3줄 이상 써요. 어떤 친구에게, 왜 추천하는지 들어가면 좋아요.</p><textarea class="inp" id="fm" style="min-height:120px"></textarea><div class="err" id="fm-err"></div><div class="foot"><button class="btn ghost" data-act="closemodal">취소</button><button class="btn gold" data-act="finsubmit" data-id="${b.id}">선생님께 보내기</button></div>`)},
 finsubmit:d=>{const t=document.getElementById('fm').value.trim();const lines=t.split(/\n|[.!?]\s/).filter(x=>x.trim().length>3).length;const p=textProblem(t,60,'추천사')||(lines<3?'추천사를 3줄(3문장) 이상 써요.':null);if(p)return document.getElementById('fm-err').textContent=p;
  const s=me();const b=s.books.find(x=>x.id===d.id);b.mission=t;S.approvals.push({id:uid(),sid:s.id,type:'fin',bookId:b.id,book:b.title,text:t,date:today(),status:'wait'});save();closeModal();renderPanel();toast('추천사를 보냈어요!','good')},
 // teacher
 ttab:d=>{cur.ttab=d.t;render()},
 approve:d=>{const a=S.approvals.find(x=>x.id===d.id);a.status='ok';if(d.best)a.best=true;a.decided=today();save();render();toast('승인했어요. 학생이 접속하면 보상이 들어가요.','good')},
 reject:d=>{modal(`<h2>다시 써 보기로 돌려보내기</h2><p class="small">학생에게 보낼 한마디를 적어 주세요.</p><textarea class="inp" id="rj" placeholder="예: 책 내용과 연결된 질문으로 다시 만들어 볼까?"></textarea><div class="foot"><button class="btn ghost" data-act="closemodal">취소</button><button class="btn ruby" data-act="rejectok" data-id="${d.id}">보내기</button></div>`)},
 rejectok:d=>{const a=S.approvals.find(x=>x.id===d.id);a.status='no';a.note=document.getElementById('rj').value.trim();a.decided=today();save();closeModal();render()},
 stuinfo:d=>stuInfo(d.id),
 gift:d=>{const s=S.students[d.id];const g=parseInt(document.getElementById('g-gold').value,10)||0,m=parseInt(document.getElementById('g-gem').value,10)||0,why=document.getElementById('g-why').value.trim();if(g<=0&&m<=0)return;
  S.approvals.push({id:uid(),sid:s.id,type:'gift',gold:g,gems:m,text:why,date:today(),status:'ok'});save();closeModal();toast('보냈어요. 학생이 접속하면 받아요.','good');render()},
 resetpin:d=>{S.students[d.id].pinH=hpin('0000');save();closeModal();toast('비밀번호를 0000으로 바꿨어요. 학생에게 알려 주세요.','good')},
 delstu:d=>{const s=S.students[d.id];if(!confirm(`${s.num}번 ${s.nick}의 모든 기록을 지울까요? 되돌릴 수 없어요.`))return;remoteDel('st',d.id);S.approvals.filter(a=>a.sid===d.id).forEach(a=>remoteDel('ap',a.id));delete S.students[d.id];S.approvals=S.approvals.filter(a=>a.sid!==d.id);save();closeModal();render()},
 setcls:()=>{const v=document.getElementById('t-cls').value.trim();if(v){S.settings.className=v;save();render();toast('저장했어요.','good')}},
 dbl:()=>{S.settings.expMult=S.settings.expMult>1?1:2;save();render();toast(S.settings.expMult>1?'더블 EXP 데이를 켰어요.':'더블 EXP 데이를 껐어요.','good')},
 setpin:()=>{const v=document.getElementById('t-pin').value.trim();if(!/^\d{4,8}$/.test(v))return toast('숫자 4~8자리로 정해요.','bad');S.settings.teacherPinH=hpin(v);save();render();toast('선생님 비밀번호를 바꿨어요.','good')},
 backup:()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal(`<h2>백업 코드</h2><p class="small muted">전체를 복사해 안전한 곳에 붙여 두세요. 이 코드로 다른 기기에서 그대로 되살릴 수 있어요.</p><textarea class="inp" style="min-height:200px;font-size:.72rem" readonly onclick="this.select()">${code}</textarea><div class="foot"><button class="btn" data-act="closemodal">닫기</button></div>`)},
 restore:()=>{modal(`<h2>백업 코드로 되살리기</h2><p class="small">지금 이 기기의 기록은 백업 코드 내용으로 바뀌어요.</p><textarea class="inp" id="rs" style="min-height:160px;font-size:.72rem"></textarea><div class="err" id="rs-err"></div><div class="foot"><button class="btn ghost" data-act="closemodal">취소</button><button class="btn ruby" data-act="restoreok">되살리기</button></div>`)},
 restoreok:()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('rs').value.trim()))));if(!o.students||!o.settings)throw 0;S=o;normalize();Object.keys(lastJ).forEach(k=>delete lastJ[k]);save();closeModal();render();toast('되살렸어요.','good')}catch(e){document.getElementById('rs-err').textContent='백업 코드가 올바르지 않아요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해요.'}},
 wipe:()=>{if(!confirm('모든 학생과 기록을 지울까요? 되돌릴 수 없어요.'))return;const pin=S.settings.teacherPinH,cls=S.settings.className;if(REMOTE){Object.keys(S.students).forEach(id=>remoteDel('st',id));S.approvals.forEach(a=>remoteDel('ap',a.id))}S=fresh();S.settings.teacherPinH=pin;S.settings.className=cls;save();render()},
 csv:d=>{const st=Object.values(S.students).sort((a,b)=>a.num-b.num);let rows;
  if(d.k==='stu'){rows=[['번호','닉네임','레벨','직업','누적쪽수','기록횟수','완독권수','질문수','인증질문','느낀점글자','연속기록최고','마지막기록일']];st.forEach(s=>rows.push([s.num,s.nick,s.lv,s.job?JOBS[s.job.line].tiers[s.job.tier]:'',s.stats.pages,s.stats.records,s.stats.finished,s.stats.questions,s.stats.approvedQ,s.stats.feelChars,s.streak.best,s.records.length?s.records[s.records.length-1].date:'']))}
  else{rows=[['날짜','번호','닉네임','책','장르','시작쪽','끝쪽','쪽수','한줄요약','느낀점','궁금한점','인상깊은문장','이유','새낱말']];st.forEach(s=>s.records.forEach(r=>{const b=s.books.find(x=>x.id===r.bookId)||{};rows.push([r.date,s.num,s.nick,b.title,b.genre,r.from,r.to,r.pages,r.summary,r.feel,r.question,r.quote,r.why,(r.words||[]).map(w=>w.w+':'+w.m).join(' / ')])}))}
  exportFile(d.k==='stu'?'학생현황.csv':'독서기록.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalEl)closeModal();if(e.key==='Enter'){const el=e.target.closest&&e.target.closest('tr[data-act]');if(el)A[el.dataset.act](el.dataset,el)}});
boot();
})();
</script>
</body>
</html>
